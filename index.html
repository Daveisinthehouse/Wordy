<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Wordy — Word Ladder</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#172033;--muted:#667085;--border:#d8dde7;--accent:#5146e5;--good:#16a34a;--bad:#dc2626;--key:#e8ecf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(480px,100%);margin:auto;padding:18px 14px 28px}
header{text-align:center;margin:3px 0 15px}h1{font-size:38px;letter-spacing:-1.5px;margin:0;font-weight:850}h1 span{color:var(--accent)}.tag{color:var(--muted);margin:1px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px 14px 16px;box-shadow:0 8px 30px #1822300d}.info{display:flex;justify-content:space-between;align-items:center;margin:0 auto 15px;max-width:300px}.info div{text-align:center}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.word{font-weight:850;font-size:18px;letter-spacing:2px}
#board{width:min(300px,78vw);margin:0 auto;display:grid;gap:7px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{aspect-ratio:1;border:2px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(23px,7vw,31px);font-weight:850;text-transform:uppercase;background:#fff}.row.start .tile{background:#eef0ff;border-color:#c9caff;color:#3730a3}.row.target .tile{background:#ecfdf3;border-color:#b7efc9;color:#166534}.row.current .tile{border-color:#8d96a8}.tile.filled{border-color:#8d96a8}.tile.green{background:#16a34a!important;border-color:#15803d!important;color:#fff!important}.tile.yellow{background:#facc15!important;border-color:#eab308!important;color:#422006!important}.tile.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.controls{margin:16px auto 0;max-width:380px}.hint{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin-bottom:8px}.hint.error{color:var(--bad);font-weight:700}.hint.good{color:var(--good);font-weight:700}
.keyboard{display:grid;gap:7px;margin-top:8px}.krow{display:flex;justify-content:center;gap:5px}.key{height:45px;min-width:30px;padding:0 8px;border:0;border-radius:7px;background:var(--key);color:var(--text);font-size:15px;font-weight:750;cursor:pointer;-webkit-tap-highlight-color:transparent}.key.wide{min-width:54px;font-size:12px}.key:active{transform:scale(.96)}
.actions{display:flex;justify-content:center;gap:8px;margin-top:13px}.action{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;color:var(--text)}.action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:#11182799;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;padding:25px;max-width:350px;width:100%;text-align:center;box-shadow:0 20px 60px #0003}.modalbox h2{margin:0 0 7px}.modalbox p{color:var(--muted);line-height:1.5}.score{font-size:30px;font-weight:850;color:var(--accent);margin:8px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}@media(max-width:370px){.key{height:42px;min-width:26px;padding:0 6px}.key.wide{min-width:48px}}
</style></head>
<body><div class="wrap">
<header><h1>W<span>o</span>rdy</h1><p class="tag">Change one letter at a time.</p></header>
<section class="card">
<div class="info"><div><div class="label">Start</div><div class="word" id="startWord"></div></div><div><div class="label">Target</div><div class="word" id="targetWord"></div></div></div>
<div id="board"></div>
<div class="controls"><div id="hint" class="hint">Change one letter from the word above.</div><div id="keyboard" class="keyboard"></div>
<div class="actions"><button class="action" id="newGame">New game</button><button class="action primary" id="howTo">How to play</button></div></div>
</section><footer>5 letters • 5 rows • <span id="dictCount">…</span> words in the dictionary</footer></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div class="score" id="modalScore"></div><p id="modalText"></p><button class="action primary" id="modalNew">Play again</button></div></div>
<script>
const WORD_SOURCE="https://raw.githubusercontent.com/BartMassey/wordle5/main/words-alpha.txt";
const FALLBACK=["cold","cord","card","ward","warm","head","heal","teal","tell","tail","plane","place","peace","grace","grape","light","might","right","sight","night","bake","bike","bile","file","fill","till","tall","talk","walk","wall","best","belt","felt","fell","fall","rest","rent","sent","send","sand","mind","mild","wild","will","wind","wine","fine","fire","gold","good","food","fool","tool","toll","told","cash","case","base"];
let validWords=new Set(),wordList=[],puzzle=null,rows=[],current="",gameReady=false;
const board=document.getElementById("board"),hint=document.getElementById("hint"),keyboard=document.getElementById("keyboard");
function setHint(s,type=""){hint.textContent=s;hint.className="hint "+type}
function changes(a,b){let n=0;for(let i=0;i<5;i++)if(a[i]!==b[i])n++;return n}
function neighbours(word){const out=[],chars=word.split("");for(let i=0;i<5;i++){const old=chars[i];for(let c=97;c<=122;c++){const ch=String.fromCharCode(c);if(ch===old)continue;chars[i]=ch;const candidate=chars.join("");if(validWords.has(candidate))out.push(candidate)}chars[i]=old}return out}
function findPuzzle(){
  for(let attempt=0;attempt<80;attempt++){
    const start=wordList[Math.floor(Math.random()*wordList.length)];if(!start)continue;
    const parent=new Map([[start,null]]),depth=new Map([[start,0]]);let queue=[start],targets=[];
    while(queue.length){const w=queue.shift(),d=depth.get(w);if(d===4){targets.push(w);continue}for(const n of neighbours(w)){if(!depth.has(n)){depth.set(n,d+1);parent.set(n,w);queue.push(n)}}if(targets.length>=20)break}
    if(targets.length){const target=targets[Math.floor(Math.random()*targets.length)],path=[];let x=target;while(x){path.push(x);x=parent.get(x)}path.reverse();if(path.length===5)return{start,target,path}}
  }
  return{start:"cold",target:"warm",path:["cold","cord","card","ward","warm"]}
}
function choosePuzzle(){puzzle=findPuzzle();rows=[puzzle.start.toUpperCase()];current="";document.getElementById("startWord").textContent=puzzle.start.toUpperCase();document.getElementById("targetWord").textContent="?????";setHint("Change one letter from the word above.");draw()}
function draw(){board.innerHTML="";for(let r=0;r<5;r++){const row=document.createElement("div");row.className="row"+(r===0?" start":"")+(r===4?" target":"")+(r===rows.length?" current":"");let word=r===0?rows[0]:(r===4?"":(rows[r]||""));if(r===rows.length&&r>0)word=current;
    for(let c=0;c<5;c++){const t=document.createElement("div");t.className="tile"+(word[c]?" filled":"");t.textContent=word[c]||"";
      if(r>0&&r<rows.length&&word.length===5){
        const target=puzzle.target.toLowerCase(),letter=word[c].toLowerCase();
        if(letter===target[c])t.classList.add("green");
        else if(target.includes(letter))t.classList.add("yellow");
      }
      row.appendChild(t)}board.appendChild(row)}}
function shake(){document.querySelectorAll(".row.current .tile").forEach(x=>{x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")})}
function submit(){
  if(!gameReady)return;
  if(current.length!==5){setHint("You need five letters.","error");shake();return}
  const w=current.toLowerCase(),prev=rows[rows.length-1].toLowerCase();
  if(!validWords.has(w)){setHint("That word is not in the dictionary.","error");shake();return}
  if(rows.includes(w.toUpperCase())){setHint("You already used that word.","error");shake();return}
  if(changes(prev,w)!==1){setHint("Change exactly one letter.","error");shake();return}
  rows.push(w.toUpperCase());current="";
  if(w===puzzle.target.toLowerCase()){draw();document.getElementById("targetWord").textContent=puzzle.target.toUpperCase();setHint("Perfect! You found the target.","good");setTimeout(win,250);return}
  if(rows.length===4){if(changes(w,puzzle.target.toLowerCase())===1){draw();setHint("One more move will reach the target.","good")}else{setHint("That word is valid, but it does not reach the target.","error");rows.pop()}}else setHint("Good move. Keep going!","good");
  draw()
}
function press(ch){if(!gameReady)return;if(ch==="ENTER")submit();else if(ch==="BACKSPACE")current=current.slice(0,-1);else if(current.length<5&&/^[A-Z]$/.test(ch))current+=ch;draw()}
function makeKeyboard(){keyboard.innerHTML="";["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].forEach((line,i)=>{const r=document.createElement("div");r.className="krow";if(i===2){const e=document.createElement("button");e.className="key wide";e.textContent="ENTER";e.onclick=()=>press("ENTER");r.appendChild(e)}[...line].forEach(ch=>{const b=document.createElement("button");b.className="key";b.textContent=ch;b.onclick=()=>press(ch);r.appendChild(b)});if(i===2){const b=document.createElement("button");b.className="key wide";b.textContent="⌫";b.onclick=()=>press("BACKSPACE");r.appendChild(b)}keyboard.appendChild(r)})}
function win(){document.getElementById("modalTitle").textContent="You got it!";document.getElementById("modalScore").textContent="WORDY";document.getElementById("modalText").textContent="You built the ladder from "+puzzle.start.toUpperCase()+" to "+puzzle.target.toUpperCase()+".";document.getElementById("modal").classList.add("show")}
async function loadDictionary(){
  setHint("Loading the word dictionary…");
  try{const cached=localStorage.getItem("wordy-5-letter-dictionary");if(cached){const words=JSON.parse(cached);if(Array.isArray(words)&&words.length>10000)wordList=words}}catch(e){}
  if(wordList.length<10000){try{const response=await fetch(WORD_SOURCE,{cache:"force-cache"});if(!response.ok)throw new Error("Dictionary request failed");const text=await response.text();wordList=[...new Set(text.split(/\r?\n/).map(w=>w.trim().toLowerCase()).filter(w=>/^[a-z]{5}$/.test(w)))];try{localStorage.setItem("wordy-5-letter-dictionary",JSON.stringify(wordList))}catch(e){}}catch(e){wordList=[...new Set(FALLBACK)];setHint("Large dictionary could not load, so the built-in list is being used.","error")}}
  validWords=new Set(wordList);gameReady=true;document.getElementById("dictCount").textContent=wordList.length.toLocaleString();choosePuzzle()
}
document.addEventListener("keydown",e=>{if(document.getElementById("modal").classList.contains("show"))return;if(e.key==="Enter")press("ENTER");else if(e.key==="Backspace")press("BACKSPACE");else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase())});
document.getElementById("newGame").onclick=()=>{document.getElementById("modal").classList.remove("show");if(gameReady)choosePuzzle()};
document.getElementById("modalNew").onclick=()=>{document.getElementById("modal").classList.remove("show");if(gameReady)choosePuzzle()};
document.getElementById("howTo").onclick=()=>alert("Start with the top five-letter word. Enter another five-letter word by changing exactly ONE letter. Every word must be in Wordy's dictionary. Reach the green target.");
makeKeyboard();document.getElementById("dictCount").textContent="…";loadDictionary();
</script></body></html>
